apiVersion: v1
kind: Service
metadata:
  name: {{ include "fluxer.fullname" . }}-seaweedfs
  labels:
    {{- include "fluxer.labels" . | nindent 4 }}
    app.kubernetes.io/component: seaweedfs
spec:
  type: ClusterIP
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
    - name: master
      port: 9333
      targetPort: 9333
    - name: filer
      port: 8888
      targetPort: 8888
  selector:
    {{- include "fluxer.selectorLabels" (dict "root" $ "component" "seaweedfs") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fluxer.fullname" . }}-seaweedfs
  labels:
    {{- include "fluxer.labels" . | nindent 4 }}
    app.kubernetes.io/component: seaweedfs
spec:
  serviceName: {{ include "fluxer.fullname" . }}-seaweedfs
  replicas: 1
  selector:
    matchLabels:
      {{- include "fluxer.selectorLabels" (dict "root" $ "component" "seaweedfs") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fluxer.selectorLabels" (dict "root" $ "component" "seaweedfs") | nindent 8 }}
    spec:
      containers:
        - name: seaweedfs
          image: {{ .Values.seaweedfs.image }}
          args: ["server", "-s3", "-dir=/data"]
          ports:
            - containerPort: 8333
              name: s3
            - containerPort: 9333
              name: master
            - containerPort: 8888
              name: filer
          readinessProbe:
            httpGet:
              path: /cluster/status
              port: 9333
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
          {{- with .Values.seaweedfs.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.seaweedfs.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.seaweedfs.storage.size }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fluxer.fullname" . }}-seaweedfs-init
  labels:
    {{- include "fluxer.labels" . | nindent 4 }}
    app.kubernetes.io/component: seaweedfs-init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "fluxer.selectorLabels" (dict "root" $ "component" "seaweedfs-init") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: {{ .Values.seaweedfs.image }}
          command:
            - /bin/sh
            - -c
            - |
              master="{{ include "fluxer.fullname" . }}-seaweedfs:9333"
              for i in $(seq 1 60); do
                echo "s3.bucket.create -name fluxer" | weed shell -master="$master" >/dev/null 2>&1 && break || sleep 2
              done
              {{- range .Values.seaweedfs.buckets }}
              echo "s3.bucket.create -name {{ . }}" | weed shell -master="$master" || true
              {{- end }}
              echo "buckets ready"
