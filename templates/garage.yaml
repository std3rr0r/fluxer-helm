apiVersion: garage.rajsingh.info/v1beta2
kind: GarageCluster
metadata:
  name: {{ include "fluxer.garageName" . }}
  labels:
    {{- include "fluxer.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
spec:
  image: {{ .Values.garage.image }}
  replication:
    factor: {{ .Values.garage.replication.factor }}
  storage:
    replicas: {{ .Values.garage.storage.replicas }}
    metadata:
      size: {{ .Values.garage.storage.metadata.size }}
      {{- with .Values.garage.storage.metadata.storageClass }}
      storageClassName: {{ . }}
      {{- end }}
    data:
      size: {{ .Values.garage.storage.data.size }}
      {{- with .Values.garage.storage.data.storageClass }}
      storageClassName: {{ . }}
      {{- end }}
    {{- with .Values.garage.resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  network:
    rpcBindPort: 3901
    service:
      type: ClusterIP
  s3Api:
    bindPort: 3900
    region: {{ .Values.garage.region | quote }}
  admin:
    bindPort: 3903
    adminTokenSecretRef:
      name: {{ include "fluxer.secretName" . }}
      key: GARAGE_ADMIN_TOKEN
  layoutManagement:
    autoApply: true
  database:
    engine: lmdb
  {{- with .Values.garage.extraSpec }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- range .Values.garage.buckets }}
---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: {{ include "fluxer.fullname" $ }}-{{ . }}
  labels:
    {{- include "fluxer.labels" $ | nindent 4 }}
    app.kubernetes.io/component: garage
spec:
  clusterRef:
    name: {{ include "fluxer.garageName" $ }}
  globalAlias: {{ . | quote }}
{{- end }}
---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: {{ include "fluxer.garageName" . }}
  labels:
    {{- include "fluxer.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
spec:
  clusterRef:
    name: {{ include "fluxer.garageName" . }}
  name: {{ include "fluxer.fullname" . }}
  allBuckets:
    read: true
    write: true
    owner: true
  secretTemplate:
    name: {{ include "fluxer.garageS3SecretName" . }}
    accessKeyIdKey: FLUXER_S3_ACCESS_KEY
    secretAccessKeyKey: FLUXER_S3_SECRET_KEY
    includeEndpoint: false
    includeRegion: false
