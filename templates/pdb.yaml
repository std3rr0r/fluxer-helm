{{- if .Values.podDisruptionBudget.enabled }}
{{- range $component := list "api" "gateway" "media-proxy" "app-proxy" "static-proxy" }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "fluxer.fullname" $ }}-{{ $component }}
  labels:
    {{- include "fluxer.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "fluxer.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
---
{{- end }}
{{- end }}
