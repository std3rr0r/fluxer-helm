{{- if and .Values.valkey.enabled (not .Values.valkey.external.url) }}
{{- $name := include "fluxer.valkeyName" . -}}
{{- $secretName := printf "%s-users" $name -}}
{{- $user := .Values.valkey.username -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict -}}
{{- $data := $existing.data | default dict -}}
{{- $pw := "" -}}
{{- if .Values.valkey.password }}
{{- $pw = .Values.valkey.password | b64enc }}
{{- else if hasKey $data $user }}
{{- $pw = get $data $user }}
{{- else }}
{{- $pw = randAlphaNum 32 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "fluxer.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $user }}: {{ $pw }}
---
apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: {{ $name }}
  labels:
    {{- include "fluxer.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  shards: {{ .Values.valkey.shards }}
  replicas: {{ .Values.valkey.replicas }}
  {{- with .Values.valkey.image }}
  image: {{ . }}
  {{- end }}
  {{- with .Values.valkey.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  persistence:
    size: {{ .Values.valkey.storage.size }}
    {{- with .Values.valkey.storage.storageClass }}
    storageClassName: {{ . }}
    {{- end }}
    reclaimPolicy: {{ .Values.valkey.storage.reclaimPolicy }}
  exporter:
    enabled: {{ .Values.valkey.prometheus }}
  {{- with .Values.valkey.tlsSecretName }}
  tls:
    certificate:
      secretName: {{ . }}
  {{- end }}
  users:
    - name: {{ $user }}
      enabled: true
      passwordSecret:
        name: {{ $secretName }}
        keys:
          - {{ $user }}
      permissions: {{ required "valkey.permissions must not be empty: the operator builds the ACL literally, so a user with no rules can authenticate but gets NOPERM on every command" .Values.valkey.permissions | quote }}
  {{- with .Values.valkey.config }}
  config:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.valkey.scheduling }}
  scheduling:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.valkey.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.valkey.extraSpec }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
