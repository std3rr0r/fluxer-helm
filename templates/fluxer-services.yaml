{{/* ---------------- app-proxy (own env only, plus discovery caddy sidecar) ---------------- */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-app-proxy
  labels:
    {{- include "fluxer.labels" . | nindent 4 }}
    app.kubernetes.io/component: app-proxy
spec:
  replicas: {{ .Values.services.appProxy.replicas }}
  selector:
    matchLabels:
      {{- include "fluxer.selectorLabels" (dict "root" . "component" "app-proxy") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fluxer.selectorLabels" (dict "root" . "component" "app-proxy") | nindent 8 }}
      annotations:
        checksum/secrets: {{ include "fluxer.secretsChecksum" . }}
        {{- with .Values.services.appProxy.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: app-proxy
          image: "{{ .Values.image.registry }}/fluxer-app-proxy-self-hosted:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: FLUXER_APP_PROXY_HOST
              value: 0.0.0.0
            - name: FLUXER_APP_PROXY_PORT
              value: "8080"
            - name: DISCOVERY_UPSTREAM_URL
              value: http://127.0.0.1:8088/.well-known/fluxer
            - name: PUBLIC_BOOTSTRAP_API_ENDPOINT
              value: /api
            - name: PUBLIC_BOOTSTRAP_API_PUBLIC_ENDPOINT
              value: {{ printf "%s/api" $origin | quote }}
            {{- with .Values.services.appProxy.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- with .Values.services.appProxy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: discovery-proxy
          image: {{ .Values.discoveryProxy.image }}
          command:
            - caddy
          args:
            - reverse-proxy
            - --from
            - :8088
            - --to
            - {{ printf "%s-api:8080" $fullname }}
          volumeMounts:
            - name: caddy-config
              mountPath: /config
            - name: caddy-data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: caddy-config
          emptyDir: {}
        - name: caddy-data
          emptyDir: {}
      {{- with .Values.services.appProxy.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.services.appProxy.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.services.appProxy.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-app-proxy
  labels:
    {{- include "fluxer.labels" . | nindent 4 }}
    app.kubernetes.io/component: app-proxy
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    {{- include "fluxer.selectorLabels" (dict "root" . "component" "app-proxy") | nindent 4 }}
