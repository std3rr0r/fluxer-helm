{{- $origin := include "fluxer.publicOrigin" . -}}
{{- $fullname := include "fluxer.fullname" . -}}

{{/* ---------------- api ---------------- */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "fluxer.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.services.api.replicas }}
  selector:
    matchLabels:
      {{- include "fluxer.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fluxer.selectorLabels" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        checksum/secrets: {{ include "fluxer.secretsChecksum" . }}
        {{- with .Values.services.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/fluxer-api:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "fluxer.commonEnv" . | nindent 12 }}
            - name: FLUXER_API_PORT
              value: "8080"
            - name: FLUXER_API_PRESIGNED_ATTACHMENT_UPLOADS_ENABLED
              value: "true"
            {{- with .Values.services.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /_health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /_health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 6
          {{- with .Values.services.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.services.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.services.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.services.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "fluxer.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    {{- include "fluxer.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
---
{{/* ---------------- worker ---------------- */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-worker
  labels:
    {{- include "fluxer.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.services.worker.replicas }}
  selector:
    matchLabels:
      {{- include "fluxer.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fluxer.selectorLabels" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        checksum/secrets: {{ include "fluxer.secretsChecksum" . }}
        {{- with .Values.services.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.image.registry }}/fluxer-api:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /usr/src/app/fluxer_api
          command:
            - ./node_modules/.bin/tsx
            - src/WorkerEntrypoint.ts
          env:
            {{- include "fluxer.commonEnv" . | nindent 12 }}
            - name: FLUXER_API_WORKER_MODE
              value: all_lanes
            - name: FLUXER_API_WORKER_ENABLE_CRON_SCHEDULER
              value: "true"
            - name: FLUXER_API_WORKER_ENABLE_VOICE_RECONCILIATION
              value: "true"
            {{- with .Values.services.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.services.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.services.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.services.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.services.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
