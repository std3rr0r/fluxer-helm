{{/* ---------------- router/shard microservices ----------------
     snowflakes/users/messages/gifs/unfurl each get one "router" Deployment
     plus svcShardCount "shard" Deployments. They are structurally identical,
     so they are generated with a range loop rather than copied by hand. */}}
{{- range $svcName := list "snowflakes" "users" "messages" "gifs" "unfurl" }}
{{- $cfg := index $.Values.services $svcName }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-{{ $svcName }}
  labels:
    {{- include "fluxer.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $svcName }}
spec:
  replicas: {{ $cfg.routerReplicas }}
  selector:
    matchLabels:
      {{- include "fluxer.selectorLabels" (dict "root" $ "component" $svcName) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fluxer.selectorLabels" (dict "root" $ "component" $svcName) | nindent 8 }}
      annotations:
        checksum/secrets: {{ include "fluxer.secretsChecksum" $ }}
        {{- with $cfg.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $svcName }}
          image: "{{ $.Values.image.registry }}/fluxer-{{ $svcName }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            {{- include "fluxer.commonEnv" $ | nindent 12 }}
            {{- if eq $svcName "gifs" }}
            - name: FLUXER_SVC_NAME
              value: gifs
            - name: FLUXER_MEDIA_PROXY_PUBLIC_ENDPOINT
              value: {{ printf "%s/media" $origin | quote }}
            {{- end }}
            - name: FLUXER_SVC_MODE
              value: router
            {{- with $cfg.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $cfg.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $cfg.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $cfg.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $cfg.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- range $shard := until (int $.Values.svcShardCount) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-{{ $svcName }}-shard-{{ $shard }}
  labels:
    {{- include "fluxer.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $svcName }}-shard-{{ $shard }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "fluxer.selectorLabels" (dict "root" $ "component" (printf "%s-shard-%d" $svcName $shard)) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fluxer.selectorLabels" (dict "root" $ "component" (printf "%s-shard-%d" $svcName $shard)) | nindent 8 }}
      annotations:
        checksum/secrets: {{ include "fluxer.secretsChecksum" $ }}
        {{- with $cfg.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $svcName }}-shard-{{ $shard }}
          image: "{{ $.Values.image.registry }}/fluxer-{{ $svcName }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            {{- include "fluxer.commonEnv" $ | nindent 12 }}
            {{- if eq $svcName "gifs" }}
            - name: FLUXER_SVC_NAME
              value: gifs
            - name: FLUXER_MEDIA_PROXY_PUBLIC_ENDPOINT
              value: {{ printf "%s/media" $origin | quote }}
            {{- end }}
            - name: FLUXER_SVC_MODE
              value: shard
            - name: FLUXER_SVC_SHARD_ID
              value: {{ $shard | quote }}
            {{- with $cfg.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $cfg.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $cfg.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $cfg.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $cfg.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if ne $svcName "unfurl" }}
---
{{- end }}
{{- end }}
