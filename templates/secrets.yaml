{{- if not .Values.secrets.existingSecret }}
{{- $name := include "fluxer.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $existingData := $existing.data | default dict }}
{{- /* value precedence: explicit values.yaml value > previously generated > new random */}}
{{- $gen := dict }}
{{- range $key, $val := dict
      "MEILI_MASTER_KEY"                    .Values.secrets.meiliMasterKey
      "FLUXER_SUDO_MODE_SECRET"             .Values.secrets.sudoModeSecret
      "FLUXER_CONNECTION_INITIATION_SECRET" .Values.secrets.connectionInitiationSecret
      "FLUXER_GATEWAY_RPC_AUTH_TOKEN"       .Values.secrets.gatewayRpcAuthToken
      "FLUXER_MEDIA_PROXY_SECRET_KEY"       .Values.secrets.mediaProxySecretKey
      "FLUXER_ADMIN_SECRET_KEY_BASE"        .Values.secrets.adminSecretKeyBase
      "FLUXER_ADMIN_OAUTH_CLIENT_SECRET"    .Values.secrets.adminOauthClientSecret
      "LIVEKIT_API_KEY"                     .Values.secrets.livekitApiKey
      "LIVEKIT_API_SECRET"                  .Values.secrets.livekitApiSecret }}
  {{- if $val }}
    {{- $_ := set $gen $key ($val | b64enc) }}
  {{- else if hasKey $existingData $key }}
    {{- $_ := set $gen $key (get $existingData $key) }}
  {{- else }}
    {{- $_ := set $gen $key (randAlphaNum 48 | b64enc) }}
  {{- end }}
{{- end }}
{{- /* upload relay secret must be base64 of raw random bytes */}}
{{- if .Values.secrets.mediaProxyUploadRelaySecretBase64 }}
  {{- $_ := set $gen "FLUXER_MEDIA_PROXY_UPLOAD_RELAY_SECRET_BASE64" (.Values.secrets.mediaProxyUploadRelaySecretBase64 | b64enc) }}
{{- else if hasKey $existingData "FLUXER_MEDIA_PROXY_UPLOAD_RELAY_SECRET_BASE64" }}
  {{- $_ := set $gen "FLUXER_MEDIA_PROXY_UPLOAD_RELAY_SECRET_BASE64" (get $existingData "FLUXER_MEDIA_PROXY_UPLOAD_RELAY_SECRET_BASE64") }}
{{- else }}
  {{- $_ := set $gen "FLUXER_MEDIA_PROXY_UPLOAD_RELAY_SECRET_BASE64" (randAscii 32 | b64enc | b64enc) }}
{{- end }}
{{- /* VAPID keys cannot be random strings — require them */}}
{{- $vapidPub := .Values.secrets.vapid.publicKey }}
{{- $vapidPriv := .Values.secrets.vapid.privateKey }}
{{- if and (not $vapidPub) (hasKey $existingData "FLUXER_VAPID_PUBLIC_KEY") }}
  {{- $_ := set $gen "FLUXER_VAPID_PUBLIC_KEY" (get $existingData "FLUXER_VAPID_PUBLIC_KEY") }}
  {{- $_ := set $gen "FLUXER_VAPID_PRIVATE_KEY" (get $existingData "FLUXER_VAPID_PRIVATE_KEY") }}
{{- else }}
  {{- $_ := set $gen "FLUXER_VAPID_PUBLIC_KEY" ((required "secrets.vapid.publicKey is required (generate with: npx web-push generate-vapid-keys --json)" $vapidPub) | b64enc) }}
  {{- $_ := set $gen "FLUXER_VAPID_PRIVATE_KEY" ((required "secrets.vapid.privateKey is required (generate with: npx web-push generate-vapid-keys --json)" $vapidPriv) | b64enc) }}
{{- end }}
{{- /* Klipy is an optional integration: keep it empty rather than generating one */}}
{{- if .Values.secrets.klipyApiKey }}
  {{- $_ := set $gen "FLUXER_KLIPY_API_KEY" (.Values.secrets.klipyApiKey | b64enc) }}
{{- else if hasKey $existingData "FLUXER_KLIPY_API_KEY" }}
  {{- $_ := set $gen "FLUXER_KLIPY_API_KEY" (get $existingData "FLUXER_KLIPY_API_KEY") }}
{{- end }}
{{- if .Values.email.smtp.password }}
  {{- $_ := set $gen "FLUXER_EMAIL_SMTP_PASSWORD" (.Values.email.smtp.password | b64enc) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "fluxer.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $k, $v := $gen }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
